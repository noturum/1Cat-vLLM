name: Build 1Cat-vLLM Wheel (SM70 / CUDA 12.8)

on:
  push:
    branches: [ "main", "v1.5.*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # Возможность запуска вручную

jobs:
  build-wheel:
    name: Build Wheel (Python 3.12, CUDA 12.8, SM70)
    runs-on: ubuntu-22.04   # Рекомендуемый образ для CUDA 12.8
    timeout-minutes: 60

    steps:
    # 1. Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Установка Python 3.12 (требование проекта)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Установка CUDA Toolkit 12.8
    - name: Install CUDA 12.8
      uses: Jimver/cuda-toolkit@v0.2.25
      with:
        cuda: '12.8.0'
        method: 'network'
        sub-packages: '["nvcc", "cudart", "cublas", "curand", "cusparse", "cusolver"]'

    # 4. Установка системных зависимостей (компиляторы, ninja, patchelf)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build patchelf

    # 5. Установка Python-зависимостей для сборки
    - name: Install Python build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128

    # 6. Сборка wheel-пакета
    - name: Build wheel
      env:
        # Ключевые переменные для сборки под SM70
        TORCH_CUDA_ARCH_LIST: "7.0"
        CMAKE_CUDA_ARCHITECTURES: "70"
        CUDA_HOME: "/usr/local/cuda-12.8"
        # Отключаем изоляцию сборки для использования установленных зависимостей
        PIP_NO_BUILD_ISOLATION: "1"
      run: |
        # Сборка wheel
        python -m build --wheel --no-isolation
        
        # Проверка созданного артефакта
        ls -lh dist/
        echo "Wheel built successfully:"
        find dist/ -name "*.whl" -exec basename {} \;

    # 7. Загрузка wheel как артефакта
    - name: Upload Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 1cat-vllm-wheel-sm70-cu128
        path: dist/*.whl
        retention-days: 7
